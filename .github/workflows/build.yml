name: Construire l'APK Transcripteur

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

env:
  SHERPA_VERSION: v1.13.8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Générer le projet Android
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "fr.transcripteur"
              compileSdk = 35

              defaultConfig {
                  applicationId = "fr.transcripteur"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += "arm64-v8a" }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              androidResources { noCompress.addAll(listOf("onnx", "txt")) }
              packaging { jniLibs { useLegacyPackaging = true } }
              lint { checkReleaseBuilds = false; abortOnError = false }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Transcripteur"
                  android:icon="@android:drawable/ic_btn_speak_now"
                  android:largeHeap="true"
                  android:extractNativeLibs="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="audio/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:scheme="content" android:mimeType="audio/*" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/fr/transcripteur/AudioDecoder.kt')"
          cat > 'app/src/main/java/fr/transcripteur/AudioDecoder.kt' <<'EOF_FILE'
          package fr.transcripteur

          import android.content.Context
          import android.media.AudioFormat
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.net.Uri
          import java.nio.ByteOrder
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.sin

          /** Décode n'importe quel audio lisible par Android (m4a/AAC, mp3, ogg, wav…) en PCM mono 16 kHz. */
          object AudioDecoder {

              private class FloatBuilder(initial: Int) {
                  var data = FloatArray(initial)
                  var size = 0
                  fun add(v: Float) {
                      if (size == data.size) data = data.copyOf(data.size * 2)
                      data[size++] = v
                  }
                  fun toArray(): FloatArray = data.copyOf(size)
              }

              fun decode(ctx: Context, uri: Uri, targetRate: Int, onProgress: (Float) -> Unit): FloatArray {
                  val extractor = MediaExtractor()
                  extractor.setDataSource(ctx, uri, null)

                  var track = -1
                  for (i in 0 until extractor.trackCount) {
                      val mime = extractor.getTrackFormat(i).getString(MediaFormat.KEY_MIME) ?: continue
                      if (mime.startsWith("audio/")) { track = i; break }
                  }
                  require(track >= 0) { "Aucune piste audio trouvée dans ce fichier." }

                  extractor.selectTrack(track)
                  val format = extractor.getTrackFormat(track)
                  val mime = format.getString(MediaFormat.KEY_MIME)!!
                  val durationUs = if (format.containsKey(MediaFormat.KEY_DURATION)) format.getLong(MediaFormat.KEY_DURATION) else 0L
                  var sampleRate = format.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                  var channels = format.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                  var encoding = AudioFormat.ENCODING_PCM_16BIT

                  val codec = MediaCodec.createDecoderByType(mime)
                  codec.configure(format, null, null, 0)
                  codec.start()

                  val estimate = if (durationUs > 0) (durationUs / 1_000_000.0 * sampleRate).toInt() + 16000 else 16000 * 60
                  val out = FloatBuilder(estimate.coerceAtLeast(16000))
                  val info = MediaCodec.BufferInfo()
                  var inputDone = false
                  var outputDone = false
                  var lastReported = -1

                  try {
                      while (!outputDone) {
                          if (!inputDone) {
                              val inIdx = codec.dequeueInputBuffer(10_000)
                              if (inIdx >= 0) {
                                  val buf = codec.getInputBuffer(inIdx)!!
                                  val n = extractor.readSampleData(buf, 0)
                                  if (n < 0) {
                                      codec.queueInputBuffer(inIdx, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                      inputDone = true
                                  } else {
                                      val t = extractor.sampleTime
                                      codec.queueInputBuffer(inIdx, 0, n, t, 0)
                                      extractor.advance()
                                      if (durationUs > 0) {
                                          val p = (100 * t / durationUs).toInt()
                                          if (p != lastReported) { lastReported = p; onProgress(p / 100f) }
                                      }
                                  }
                              }
                          }

                          val outIdx = codec.dequeueOutputBuffer(info, 10_000)
                          if (outIdx >= 0) {
                              val buf = codec.getOutputBuffer(outIdx)!!
                              buf.position(info.offset)
                              buf.limit(info.offset + info.size)
                              val b = buf.slice().order(ByteOrder.nativeOrder())
                              if (encoding == AudioFormat.ENCODING_PCM_FLOAT) {
                                  val fb = b.asFloatBuffer()
                                  val frames = fb.remaining() / channels
                                  for (f in 0 until frames) {
                                      var s = 0f
                                      for (c in 0 until channels) s += fb.get()
                                      out.add(s / channels)
                                  }
                              } else {
                                  val sb = b.asShortBuffer()
                                  val frames = sb.remaining() / channels
                                  for (f in 0 until frames) {
                                      var s = 0f
                                      for (c in 0 until channels) s += sb.get()
                                      out.add(s / channels / 32768f)
                                  }
                              }
                              codec.releaseOutputBuffer(outIdx, false)
                              if (info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM != 0) outputDone = true
                          } else if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              val f = codec.outputFormat
                              sampleRate = f.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                              channels = f.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                              if (f.containsKey(MediaFormat.KEY_PCM_ENCODING)) encoding = f.getInteger(MediaFormat.KEY_PCM_ENCODING)
                          }
                      }
                  } finally {
                      codec.stop(); codec.release(); extractor.release()
                  }

                  val mono = out.toArray()
                  return resample(mono, sampleRate, targetRate)
              }

              /** Rééchantillonnage par sinc fenêtré (Hann), noyau tabulé pour la vitesse. */
              fun resample(x: FloatArray, from: Int, to: Int): FloatArray {
                  if (from == to || x.isEmpty()) return x
                  val ratio = from.toDouble() / to
                  val cut = 0.95 * (if (ratio > 1.0) 1.0 / ratio else 1.0)
                  val zeroCrossings = 8
                  val width = (zeroCrossings / cut).toInt() + 1
                  val res = 256
                  val table = FloatArray((width + 1) * res + 1) { k ->
                      val d = k.toDouble() / res
                      val xx = d * cut
                      val s = if (xx < 1e-9) 1.0 else sin(PI * xx) / (PI * xx)
                      val w = if (d >= width) 0.0 else 0.5 + 0.5 * cos(PI * d / width)
                      (s * w * cut).toFloat()
                  }
                  val outLen = (x.size / ratio).toInt()
                  val y = FloatArray(outLen)
                  for (i in 0 until outLen) {
                      val t = i * ratio
                      val c = t.toInt()
                      var acc = 0f
                      val lo = maxOf(0, c - width + 1)
                      val hi = minOf(x.size - 1, c + width)
                      for (j in lo..hi) {
                          val k = (abs(t - j) * res).toInt()
                          if (k < table.size) acc += x[j] * table[k]
                      }
                      y[i] = acc
                  }
                  return y
              }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/fr/transcripteur/MainActivity.kt')"
          cat > 'app/src/main/java/fr/transcripteur/MainActivity.kt' <<'EOF_FILE'
          package fr.transcripteur

          import android.app.ActivityManager
          import android.app.ApplicationExitInfo
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.view.WindowManager
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ProgressBar
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class MainActivity : AppCompatActivity() {

              // Langues prises en charge par Canary 180M Flash
              private val languages = listOf("Français" to "fr", "Anglais" to "en", "Espagnol" to "es", "Allemand" to "de")

              // Seuil de clustering : plus petit = sépare davantage les voix
              private val separations = listOf(
                  "Normale" to 0.40f,
                  "Forte (voix proches)" to 0.30f,
                  "Faible (trop d'intervenants)" to 0.55f,
              )

              private var audioUri: Uri? = null
              private var audioName = "transcription"
              private var transcript = ""
              private var busy = false

              private lateinit var btnPick: Button
              private lateinit var btnRun: Button
              private lateinit var btnCopy: Button
              private lateinit var btnShare: Button
              private lateinit var btnSave: Button
              private lateinit var txtFile: TextView
              private lateinit var txtStatus: TextView
              private lateinit var txtResult: TextView
              private lateinit var edSpeakers: EditText
              private lateinit var edWindow: EditText
              private lateinit var spLang: Spinner
              private lateinit var spSep: Spinner
              private lateinit var progress: ProgressBar

              private val pickAudio = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) setAudio(uri)
              }

              private val saveTxt = registerForActivityResult(ActivityResultContracts.CreateDocument("text/plain")) { uri ->
                  if (uri != null) {
                      try {
                          contentResolver.openOutputStream(uri)?.use { it.write(transcript.toByteArray(Charsets.UTF_8)) }
                          toast("Fichier enregistré")
                      } catch (e: Exception) {
                          toast("Erreur d'enregistrement : ${e.message}")
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val root = findViewById<android.view.View>(R.id.root)
                  val pad = root.paddingLeft
                  ViewCompat.setOnApplyWindowInsetsListener(root) { v, insets ->
                      val bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() or WindowInsetsCompat.Type.displayCutout())
                      v.setPadding(pad + bars.left, pad + bars.top, pad + bars.right, pad + bars.bottom)
                      insets
                  }

                  btnPick = findViewById(R.id.btnPick)
                  btnRun = findViewById(R.id.btnRun)
                  btnCopy = findViewById(R.id.btnCopy)
                  btnShare = findViewById(R.id.btnShare)
                  btnSave = findViewById(R.id.btnSave)
                  txtFile = findViewById(R.id.txtFile)
                  txtStatus = findViewById(R.id.txtStatus)
                  txtResult = findViewById(R.id.txtResult)
                  edSpeakers = findViewById(R.id.edSpeakers)
                  edWindow = findViewById(R.id.edWindow)
                  spLang = findViewById(R.id.spLang)
                  spSep = findViewById(R.id.spSep)
                  spLang.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, languages.map { it.first })
                  spSep.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, separations.map { it.first })
                  progress = findViewById(R.id.progress)

                  btnPick.setOnClickListener { pickAudio.launch(arrayOf("audio/*")) }
                  btnRun.setOnClickListener { startTranscription() }
                  btnCopy.setOnClickListener {
                      val cm = getSystemService(ClipboardManager::class.java)
                      cm?.setPrimaryClip(ClipData.newPlainText("Transcription", transcript))
                      toast("Copié")
                  }
                  btnShare.setOnClickListener {
                      val send = Intent(Intent.ACTION_SEND).apply {
                          type = "text/plain"
                          putExtra(Intent.EXTRA_SUBJECT, "Transcription – $audioName")
                          putExtra(Intent.EXTRA_TEXT, transcript)
                      }
                      startActivity(Intent.createChooser(send, "Partager la transcription"))
                  }
                  btnSave.setOnClickListener { saveTxt.launch("$audioName.txt") }

                  handleIntent(intent)
                  reportPreviousCrash()
              }

              private val prefs by lazy { getSharedPreferences("etat", MODE_PRIVATE) }
              private var lastStep = ""

              /** Mémorise l'étape en cours (écriture synchrone) pour savoir où un arrêt brutal a eu lieu. */
              private fun recordStep(msg: String) {
                  val step = msg.substringBefore("…").trim()
                  if (step != lastStep) {
                      lastStep = step
                      prefs.edit().putString("etape", step).putBoolean("en_cours", busy).commit()
                  }
              }

              /** Au démarrage : si la dernière analyse a été interrompue, affiche l'étape et la raison donnée par Android. */
              private fun reportPreviousCrash() {
                  if (!prefs.getBoolean("en_cours", false)) return
                  val step = prefs.getString("etape", "?")
                  prefs.edit().putBoolean("en_cours", false).commit()
                  var reason = "raison inconnue"
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          val am = getSystemService(ActivityManager::class.java)
                          val info = am?.getHistoricalProcessExitReasons(packageName, 0, 1)?.firstOrNull()
                          if (info != null) {
                              reason = when (info.reason) {
                                  ApplicationExitInfo.REASON_LOW_MEMORY -> "mémoire du téléphone insuffisante"
                                  ApplicationExitInfo.REASON_CRASH_NATIVE -> "plantage du moteur de calcul"
                                  ApplicationExitInfo.REASON_CRASH -> "erreur de l'application"
                                  ApplicationExitInfo.REASON_ANR -> "application bloquée"
                                  ApplicationExitInfo.REASON_SIGNALED -> "arrêtée par le système"
                                  ApplicationExitInfo.REASON_EXCESSIVE_RESOURCE_USAGE -> "consommation excessive"
                                  ApplicationExitInfo.REASON_USER_REQUESTED, ApplicationExitInfo.REASON_USER_STOPPED -> "fermée manuellement"
                                  else -> "code ${info.reason}"
                              } + (info.description?.let { " ($it)" } ?: "") + ", mémoire utilisée ${info.pss / 1024} Mo"
                          }
                      } catch (_: Exception) { }
                  }
                  txtStatus.text = "⚠ La dernière analyse s'est arrêtée à l'étape « $step » : $reason."
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  handleIntent(intent)
              }

              private fun handleIntent(intent: Intent?) {
                  if (intent == null || busy) return
                  val uri: Uri? = when (intent.action) {
                      Intent.ACTION_SEND -> streamUri(intent)
                      Intent.ACTION_VIEW -> intent.data
                      else -> null
                  }
                  if (uri != null) setAudio(uri)
              }

              @Suppress("DEPRECATION")
              private fun streamUri(intent: Intent): Uri? =
                  if (Build.VERSION.SDK_INT >= 33) intent.getParcelableExtra(Intent.EXTRA_STREAM, Uri::class.java)
                  else intent.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)

              private fun setAudio(uri: Uri) {
                  audioUri = uri
                  var name = uri.lastPathSegment ?: "audio"
                  try {
                      contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { c ->
                          if (c.moveToFirst()) name = c.getString(0) ?: name
                      }
                  } catch (_: Exception) { }
                  audioName = name.substringBeforeLast('.')
                  txtFile.text = name
                  btnRun.isEnabled = !busy
              }

              private fun startTranscription() {
                  val uri = audioUri ?: return
                  val n = edSpeakers.text.toString().toIntOrNull() ?: 0
                  val w = (edWindow.text.toString().toFloatOrNull() ?: 28f).coerceIn(5f, 40f)
                  edWindow.setText(w.toInt().toString())
                  val params = Params(
                      language = languages[spLang.selectedItemPosition].second,
                      numSpeakers = n,
                      threshold = separations[spSep.selectedItemPosition].second,
                      windowSec = w,
                  )

                  busy = true
                  setButtons(false)
                  transcript = ""
                  txtResult.text = ""
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  lifecycleScope.launch {
                      try {
                          val result = withContext(Dispatchers.Default) {
                              Transcriber.run(
                                  this@MainActivity, uri, params,
                                  status = { msg, p -> recordStep(msg); runOnUiThread { txtStatus.text = msg; progress.progress = p } },
                                  partial = { txt -> runOnUiThread { txtResult.text = txt } },
                              )
                          }
                          transcript = result
                          txtResult.text = result
                      } catch (t: Throwable) {
                          txtStatus.text = "Erreur : ${t.message ?: t.javaClass.simpleName}"
                          if (t is OutOfMemoryError) txtStatus.append("\nFichier trop long pour la mémoire du téléphone : découpez-le.")
                      } finally {
                          busy = false
                          prefs.edit().putBoolean("en_cours", false).commit()
                          lastStep = ""
                          window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                          setButtons(true)
                      }
                  }
              }

              private fun setButtons(enabled: Boolean) {
                  btnPick.isEnabled = enabled
                  btnRun.isEnabled = enabled && audioUri != null
                  val has = enabled && transcript.isNotBlank()
                  btnCopy.isEnabled = has
                  btnShare.isEnabled = has
                  btnSave.isEnabled = has
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/fr/transcripteur/Transcriber.kt')"
          cat > 'app/src/main/java/fr/transcripteur/Transcriber.kt' <<'EOF_FILE'
          package fr.transcripteur

          import android.content.Context
          import android.net.Uri
          import com.k2fsa.sherpa.onnx.FastClusteringConfig
          import com.k2fsa.sherpa.onnx.FeatureConfig
          import com.k2fsa.sherpa.onnx.OfflineCanaryModelConfig
          import com.k2fsa.sherpa.onnx.OfflineModelConfig
          import com.k2fsa.sherpa.onnx.OfflineRecognizer
          import com.k2fsa.sherpa.onnx.OfflineRecognizerConfig
          import com.k2fsa.sherpa.onnx.OfflineSpeakerDiarization
          import com.k2fsa.sherpa.onnx.OfflineSpeakerDiarizationConfig
          import com.k2fsa.sherpa.onnx.OfflineSpeakerSegmentationModelConfig
          import com.k2fsa.sherpa.onnx.OfflineSpeakerSegmentationPyannoteModelConfig
          import com.k2fsa.sherpa.onnx.SpeakerEmbeddingExtractor
          import com.k2fsa.sherpa.onnx.SpeakerEmbeddingExtractorConfig
          import kotlin.math.ceil
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sqrt

          /**
           * Rappel de progression appelé par le code natif.
           * Doit être une vraie classe (pas un lambda) : le code natif cherche invoke(int, int, long) -> Integer.
           */
          class DiarizationProgress(private val status: (String, Int) -> Unit) : (Int, Int, Long) -> Int {
              override fun invoke(done: Int, total: Int, arg: Long): Int {
                  val p = if (total > 0) 10 + 25 * done / total else 10
                  status("Identification des intervenants… ($done/$total)", p)
                  return 0
              }
          }

          data class Params(
              val language: String,        // fr, en, es, de (Canary)
              val numSpeakers: Int,        // <= 0 : automatique
              val threshold: Float,        // seuil de clustering (plus petit = plus d'intervenants)
              val windowSec: Float,        // fenêtre max de transcription
          )

          /**
           * Pipeline 100 % hors ligne :
           * 1) décodage audio -> 16 kHz mono
           * 2) diarisation pyannote 3.0 + WeSpeaker ResNet34
           * 3) chronologie sans chevauchement : un instant = un seul intervenant
           * 4) ré-attribution de chaque tour par empreinte vocale (centroïdes)
           * 5) transcription de chaque tour avec NVIDIA Canary 180M Flash, langue imposée
           */
          object Transcriber {
              const val SR = 16000
              private const val FRAME = 0.01f          // 10 ms
              private const val MERGE_GAP = 0.6f       // silence max pour fusionner deux tours du même intervenant
              private const val MIN_TURN = 0.3f        // tours plus courts ignorés (bruits)
              private const val MIN_EMB = 1.0f         // durée min pour calculer une empreinte fiable

              private class Turn(var start: Float, var end: Float, var speaker: Int) {
                  val dur get() = end - start
                  var emb: FloatArray? = null
              }

              fun run(
                  ctx: Context,
                  uri: Uri,
                  p: Params,
                  status: (String, Int) -> Unit,
                  partial: (String) -> Unit,
              ): String {
                  status("Décodage de l'audio…", 0)
                  val samples = AudioDecoder.decode(ctx, uri, SR) { f -> status("Décodage de l'audio…", (f * 10).toInt()) }
                  require(samples.size > SR / 2) { "Fichier audio vide ou trop court." }
                  val totalSec = samples.size.toFloat() / SR

                  // ---------- 1. Diarisation ----------
                  status("Chargement du modèle d'intervenants…", 10)
                  val embCfg = SpeakerEmbeddingExtractorConfig(model = "spk/embedding.onnx", numThreads = 2)
                  val sdConfig = OfflineSpeakerDiarizationConfig(
                      segmentation = OfflineSpeakerSegmentationModelConfig(
                          pyannote = OfflineSpeakerSegmentationPyannoteModelConfig(model = "seg/model.onnx"),
                          numThreads = 2,
                      ),
                      embedding = embCfg,
                      clustering = FastClusteringConfig(
                          numClusters = if (p.numSpeakers > 0) p.numSpeakers else -1,
                          threshold = p.threshold,
                      ),
                      minDurationOn = 0.2f,
                      minDurationOff = 0.3f,
                  )
                  val sd = OfflineSpeakerDiarization(ctx.assets, sdConfig)
                  val segments = try {
                      sd.processWithCallback(samples, DiarizationProgress(status))
                  } finally {
                      sd.release()
                  }

                  // ---------- 2. Chronologie sans chevauchement ----------
                  var turns = buildTimeline(segments.map { Triple(it.start, it.end, it.speaker) }, totalSec)
                  if (turns.isEmpty()) turns = arrayListOf(Turn(0f, totalSec, 0))

                  // ---------- 3. Ré-attribution par empreinte vocale ----------
                  status("Vérification des voix…", 35)
                  val ext = SpeakerEmbeddingExtractor(ctx.assets, embCfg)
                  try {
                      for ((i, t) in turns.withIndex()) {
                          if (t.dur >= MIN_EMB) t.emb = embedding(ext, samples, t.start, t.end)
                          if (i % 10 == 0) status("Vérification des voix… ${i + 1}/${turns.size}", 35 + 5 * i / turns.size)
                      }
                  } finally {
                      ext.release()
                  }
                  refine(turns, p.numSpeakers > 0)
                  turns = mergeTurns(turns)
                  padTurns(turns, totalSec)

                  val names = LinkedHashMap<Int, Int>()
                  for (t in turns) if (t.speaker !in names) names[t.speaker] = names.size + 1

                  // ---------- 4. Transcription ----------
                  status("Chargement de Canary…", 40)
                  val recConfig = OfflineRecognizerConfig(
                      featConfig = FeatureConfig(sampleRate = SR, featureDim = 128),
                      modelConfig = OfflineModelConfig(
                          canary = OfflineCanaryModelConfig(
                              encoder = "asr/encoder.int8.onnx",
                              decoder = "asr/decoder.int8.onnx",
                              srcLang = p.language,
                              tgtLang = p.language,   // même langue = transcription, jamais de traduction
                              usePnc = true,
                          ),
                          tokens = "asr/tokens.txt",
                          numThreads = 4,
                      ),
                  )
                  val rec = OfflineRecognizer(ctx.assets, recConfig)

                  val sb = StringBuilder()
                  sb.append("Transcription — ${names.size} intervenant(s) — durée ${fmt(totalSec)}\n\n")
                  try {
                      for ((i, t) in turns.withIndex()) {
                          status("Transcription… tour ${i + 1}/${turns.size}", 40 + 60 * i / turns.size)
                          val text = transcribeRange(rec, samples, t.start, t.end, p.windowSec)
                          if (text.isBlank()) continue
                          sb.append("[${fmt(t.start)} → ${fmt(t.end)}] Intervenant ${names[t.speaker]}\n")
                          sb.append(text).append("\n\n")
                          partial(sb.toString())
                      }
                  } finally {
                      rec.release()
                  }
                  status("Terminé ✔", 100)
                  return sb.toString().trimEnd() + "\n"
              }

              /**
               * Chaque trame de 10 ms est attribuée à UN seul intervenant. En cas de parole simultanée,
               * le segment le plus court (l'interruption, le « oui », la relance) l'emporte :
               * il n'est donc plus avalé dans le long tour de l'autre personne.
               */
              private fun buildTimeline(segs: List<Triple<Float, Float, Int>>, totalSec: Float): ArrayList<Turn> {
                  val n = ceil(totalSec / FRAME).toInt() + 1
                  val owner = IntArray(n) { -1 }
                  val ownerLen = FloatArray(n) { Float.MAX_VALUE }
                  for ((s, e, spk) in segs) {
                      val len = e - s
                      val a = (s / FRAME).toInt().coerceIn(0, n - 1)
                      val b = (e / FRAME).toInt().coerceIn(0, n)
                      for (f in a until b) if (len < ownerLen[f]) { owner[f] = spk; ownerLen[f] = len }
                  }
                  val runs = ArrayList<Turn>()
                  var f = 0
                  while (f < n) {
                      if (owner[f] < 0) { f++; continue }
                      val spk = owner[f]
                      val a = f
                      while (f < n && owner[f] == spk) f++
                      runs.add(Turn(a * FRAME, f * FRAME, spk))
                  }
                  return mergeTurns(runs).filterTo(ArrayList()) { it.dur >= MIN_TURN }
              }

              /** Fusionne deux tours consécutifs du même intervenant séparés par un court silence. */
              private fun mergeTurns(src: List<Turn>): ArrayList<Turn> {
                  val out = ArrayList<Turn>()
                  for (t in src.sortedBy { it.start }) {
                      val last = out.lastOrNull()
                      if (last != null && last.speaker == t.speaker && t.start - last.end <= MERGE_GAP) {
                          last.end = max(last.end, t.end)
                          last.emb = null
                      } else out.add(t)
                  }
                  return out
              }

              /** Recalcule les centroïdes vocaux et réattribue chaque tour à la voix la plus proche. */
              private fun refine(turns: List<Turn>, fixedCount: Boolean) {
                  repeat(3) {
                      val cents = centroids(turns)
                      if (cents.size < 2) return
                      if (!fixedCount) {
                          // Deux « intervenants » à la voix quasi identique = une seule personne.
                          val ids = cents.keys.toList()
                          for (i in ids.indices) for (j in i + 1 until ids.size) {
                              val a = cents[ids[i]] ?: continue
                              val b = cents[ids[j]] ?: continue
                              if (dot(a, b) > 0.80f) {
                                  for (t in turns) if (t.speaker == ids[j]) t.speaker = ids[i]
                                  cents.remove(ids[j])
                              }
                          }
                          // Un intervenant qui ne parle que < 2 % du temps est souvent une erreur : on le rattache.
                          val total = turns.sumOf { it.dur.toDouble() }
                          for (id in cents.keys.toList()) {
                              val d = turns.filter { it.speaker == id }.sumOf { it.dur.toDouble() }
                              if (cents.size > 2 && d < 0.02 * total && d < 5.0) {
                                  val c = cents.remove(id)!!
                                  val best = cents.maxByOrNull { dot(it.value, c) }!!.key
                                  for (t in turns) if (t.speaker == id) t.speaker = best
                              }
                          }
                      }
                      for (t in turns) {
                          val e = t.emb ?: continue
                          val best = cents.maxByOrNull { dot(it.value, e) } ?: continue
                          t.speaker = best.key
                      }
                  }
              }

              private fun centroids(turns: List<Turn>): HashMap<Int, FloatArray> {
                  val acc = HashMap<Int, FloatArray>()
                  for (t in turns) {
                      val e = t.emb ?: continue
                      val c = acc.getOrPut(t.speaker) { FloatArray(e.size) }
                      val w = min(t.dur, 15f)
                      for (k in e.indices) c[k] += e[k] * w
                  }
                  for (c in acc.values) normalize(c)
                  return acc
              }

              /** Petite marge (100 ms avant, 150 ms après) sans jamais empiéter sur le tour voisin. */
              private fun padTurns(turns: List<Turn>, totalSec: Float) {
                  for ((i, t) in turns.withIndex()) {
                      val prevEnd = if (i > 0) turns[i - 1].end else 0f
                      val nextStart = if (i < turns.size - 1) turns[i + 1].start else totalSec
                      t.start = max(prevEnd, t.start - 0.10f).coerceAtLeast(0f)
                      t.end = min(nextStart, t.end + 0.15f).coerceAtMost(totalSec)
                  }
              }

              private fun embedding(ext: SpeakerEmbeddingExtractor, x: FloatArray, s: Float, e: Float): FloatArray? {
                  // Au plus 10 s prises au centre du tour.
                  val mid = (s + e) / 2
                  val half = min((e - s) / 2, 5f)
                  val a = ((mid - half) * SR).toInt().coerceIn(0, x.size)
                  val b = ((mid + half) * SR).toInt().coerceIn(a, x.size)
                  if (b - a < SR / 2) return null
                  val stream = ext.createStream()
                  return try {
                      stream.acceptWaveform(x.copyOfRange(a, b), SR)
                      stream.inputFinished()
                      if (ext.isReady(stream)) normalize(ext.compute(stream)) else null
                  } finally {
                      stream.release()
                  }
              }

              private fun normalize(v: FloatArray): FloatArray {
                  var n = 0f
                  for (x in v) n += x * x
                  n = sqrt(n)
                  if (n > 0f) for (k in v.indices) v[k] /= n
                  return v
              }

              private fun dot(a: FloatArray, b: FloatArray): Float {
                  var s = 0f
                  for (k in a.indices) s += a[k] * b[k]
                  return s
              }

              /** Transcrit un tour en morceaux de [window] secondes au plus, coupés sur le passage le plus silencieux. */
              private fun transcribeRange(rec: OfflineRecognizer, x: FloatArray, startS: Float, endS: Float, window: Float): String {
                  var a = (startS * SR).toInt().coerceIn(0, x.size)
                  val b = (endS * SR).toInt().coerceIn(0, x.size)
                  val win = (window * SR).toInt()
                  val parts = ArrayList<String>()
                  while (b - a > (0.2f * SR)) {
                      var cut = b
                      if (b - a > win) cut = quietestPoint(x, a + (win * 0.65f).toInt(), a + win)
                      val stream = rec.createStream()
                      try {
                          stream.acceptWaveform(x.copyOfRange(a, cut), SR)
                          rec.decode(stream)
                          val txt = rec.getResult(stream).text.trim()
                          if (txt.isNotEmpty()) parts.add(txt)
                      } finally {
                          stream.release()
                      }
                      a = cut
                  }
                  return parts.joinToString(" ")
              }

              private fun quietestPoint(x: FloatArray, lo: Int, hi: Int): Int {
                  val win = SR / 10
                  var best = hi
                  var bestE = Double.MAX_VALUE
                  var p = lo
                  while (p + win <= hi && p + win <= x.size) {
                      var e = 0.0
                      for (k in p until p + win) e += x[k] * x[k]
                      if (e < bestE) { bestE = e; best = p + win / 2 }
                      p += win / 2
                  }
                  return best
              }

              fun fmt(s: Float): String {
                  val t = s.toInt()
                  return "%02d:%02d:%02d".format(t / 3600, (t / 60) % 60, t % 60)
              }
          }
          EOF_FILE
